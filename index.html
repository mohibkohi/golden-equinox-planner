<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Equinox | Premium Planner Test</title>
    <link rel="stylesheet" href="css/style.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="app">
        <!-- Auth View -->
        <div id="view-auth" class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <h1>Golden Equinox</h1>
                    <p>Premium Productivity</p>
                </div>

                <!-- Login Form -->
                <form id="login-form" class="auth-form">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="login-email" required placeholder="you@example.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn-primary full-width">Sign In</button>
                    <p class="auth-footer">
                        New here? <a href="#" id="show-signup">Create Account</a>
                    </p>
                </form>

                <!-- Signup Form (Hidden by default) -->
                <form id="signup-form" class="auth-form hidden">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="signup-name" required placeholder="Your Name">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="signup-email" required placeholder="you@example.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="signup-password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn-primary full-width">Create Account</button>
                    <p class="auth-footer">
                        Already have an account? <a href="#" id="show-login">Log In</a>
                    </p>
                </form>
            </div>
        </div>
        <header class="app-header">
            <div class="logo">
                <h1>Golden Equinox balla</h1>
            </div>
            <div class="controls">
                <button id="settings-btn" class="icon-btn" aria-label="Settings">
                    <span class="icon">⚙️</span>
                </button>
            </div>
        </header>

        <main class="main-layout">
            <aside class="sidebar">
                <nav class="nav-links">
                    <button class="nav-item active" data-view="tasks">Tasks</button>
                    <button class="nav-item" data-view="calendar">Calendar</button>
                    <button class="nav-item" data-view="analytics">Analytics</button>
                </nav>
                <div class="focus-control">
                    <button id="start-focus" class="btn-primary">Focus Mode</button>
                </div>
            </aside>

            <section id="content-area" class="content-area">
                <!-- Views will be injected here -->
                <div id="view-tasks" class="view active">
                    <div class="toolbar">
                        <h2>My Tasks</h2>
                        <button id="add-task-btn" class="btn-primary">+ New Task</button>
                    </div>
                    <div class="task-list" id="task-list">
                        <!-- Tasks go here -->
                        <div class="empty-state">No tasks yet. Press Cmd+K or click + New Task.</div>
                    </div>
                </div>

                <div id="view-calendar" class="view hidden">
                    <div class="calendar-header">
                        <button id="prev-month">&lt;</button>
                        <h2 id="calendar-title">December 2025</h2>
                        <button id="next-month">&gt;</button>
                    </div>
                    <div class="calendar-grid" id="calendar-grid">
                        <!-- Calendar days -->
                    </div>
                </div>

                <div id="view-analytics" class="view hidden">
                    <h2>Life Balance Analytics</h2>
                    <div class="analytics-dashboard" id="analytics-dashboard" style="margin-top: 2rem;">
                        <!-- Charts go here -->
                        <p>Loading stats...</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Command Bar Modal -->
        <dialog id="command-bar" class="command-bar-dialog">
            <div class="command-input-wrapper">
                <span class="cmd-icon">&gt;</span>
                <input type="text" id="cmd-input" placeholder="Type a command or task..." autocomplete="off">
            </div>
            <div class="command-hints">
                <span>Try: "Meeting with team tmrw 2pm"</span>
            </div>
        </dialog>

        <!-- Settings Modal (New) -->
        <div id="settings-overlay" class="settings-overlay hidden"></div>
        <div id="settings-modal" class="settings-modal hidden">
            <div class="settings-header">
                <h2>Settings</h2>
                <button id="close-settings" class="icon-btn"
                    style="border:none;background:none;font-size:1.2rem;cursor:pointer;">&times;</button>
            </div>
            <div class="settings-content">
                <div class="settings-section">
                    <h3>Theme</h3>
                    <div class="theme-grid">
                        <button class="theme-btn" data-set-theme="day">Day</button>
                        <button class="theme-btn" data-set-theme="sunset">Sunset</button>
                        <button class="theme-btn" data-set-theme="night">Night</button>
                        <button class="theme-btn" data-set-theme="vintage-rose">Rose</button>
                    </div>
                </div>
                <div class="settings-section">
                    <h3>Account</h3>
                    <button id="logout-btn-settings" class="btn-primary" style="background:#e63946;width:100%;">Log
                        Out</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script type="module" src="js/app.js"></script>
</body>

</html>
